name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node --experimental-strip-types --test src/lib/pure.test.ts
      - run: node tools/scan-secrets.mjs
      - run: npm run build
      - run: node tools/check-links.mjs
      - run: node tools/check-site.mjs
      - run: npx html-validate "dist/**/*.html"
